    status: 200
    note: Corporate + patient site (Healthera Core marketing).
  - url: https://api.healthera.co.uk/
    status: 200
    note: Returns "<h1>Healthera Core</h1>" - private backend host.
  - url: https://api.healthera.co.uk/metadata
    status: 200
    note: '{"data":[]} catch-all - NOT a FHIR CapabilityStatement.'
  - url: https://api.healthera.co.uk/.well-known/smart-configuration
    status: 200
    note: '{"data":[]} catch-all - NOT a SMART-on-FHIR configuration.'
  - url: https://api.healthera.co.uk/openapi.json
    status: 200
    note: '{"data":[]} catch-all - does not parse as OpenAPI.'
  - url: https://api.healthera.co.uk/swagger.json
    status: 200
    note: '{"data":[]} catch-all - does not parse as Swagger.'
  - url: https://developer.healthera.co.uk/
    status: 000
    note: DNS does not resolve - no developer portal.
  - url: https://docs.healthera.co.uk/
    status: 000
    note: DNS does not resolve.
  - url: https://fhir.healthera.co.uk/
    status: 000
    note: DNS does not resolve - no FHIR host.
  - url: https://healthera.co.uk/developers
    status: 404
  - url: https://healthera.co.uk/api
    status: 404
  - url: https://healthera.co.uk/interoperability
    status: 404
  - url: https://healthera.co.uk/integrations
    status: 200
    note: Business partnerships page (myGP, eConsult, NHS Digital EPS, Cegedim Rx, Medpoint, Royal Mail, Uber Eats). No API docs.
  - url: https://healthera.co.uk/blog/
    status: 200
  - url: https://github.com/healthera
    status: 200
    note: '"Healthera - GitHub" organization exists.'
transports:
  - protocol: REST
    scheme: https
    baseURL: https://api.healthera.co.uk
    documented: false
    note: Private "Healthera Core" backend; no public documentation, no published contract.
  - protocol: FHIR
    scheme: https
    documented: false
    note: No FHIR CapabilityStatement, base URL, or version published.
  - protocol: WebSocket
    scheme: wss
    documented: false
    note: No WebSocket surface documented.
sources:
